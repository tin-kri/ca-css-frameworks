<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Profile | CSS Frameworks CA Tailwind</title>
        <link rel="stylesheet" href="../style.css" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="../public/favicon_io/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="../public/favicon_io/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="../public/favicon_io/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>

    <body class="bg-pink-300">
        <header class="m md:text-lg md:font-bold">
            <nav class="container mx-auto">
                <div class="flex justify-start p-5">
                    <div
                        class="mx-auto hidden justify-center space-x-32 text-red-950 md:flex"
                    >
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/profile/index.html"
                        >
                            Profile
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/feed/index.html"
                        >
                            Feed
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/index.html"
                        >
                            Sign in
                        </a>
                    </div>

                    <div class="flex items-center md:hidden">
                        <button class="" id="menu-button">
                            <svg
                                class="h-6 w-6 text-red-950 hover:text-red-800"
                                fill="none"
                                stroke-linecap="square"
                                stroke-linejoin="round"
                                stroke-width="2.5"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="hidden font-bold text-red-950" id="mobile-nav">
                    <ul class="p-5 pt-0">
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/profile/index.html">Profile</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/feed/index.html">Feed</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/index.html">Sign in</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <div id="landing-page"></div>
            <section id="profile">
                <div class="container mx-auto p-4">
                    <div
                        class="flex flex-col lg:flex-row lg:items-start lg:justify-center lg:gap-16"
                    >
                        <div
                            class="flex flex-col items-center text-center lg:items-center lg:text-center"
                        >
                            <div
                                class="profile-container text-xl font-bold text-red-950"
                            >
                                <img
                                    class="mb-4 h-56 w-56 rounded-full object-cover"
                                    src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg/440px-Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg"
                                    alt="profile img woman with glasses"
                                />
                                <h1>Whitney Houston</h1>
                            </div>

                            <div class="mt-4 flex space-x-4">
                                <a
                                    href="#"
                                    class="flex h-10 w-10 items-center justify-center rounded-full bg-red-900 text-lg font-semibold text-white shadow-md hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 focus:ring-offset-2 sm:hidden"
                                >
                                    +
                                </a>
                                <a
                                    href="#"
                                    class="hidden rounded-lg bg-red-900 px-6 py-3 font-semibold text-white shadow-md hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 focus:ring-offset-2 sm:flex"
                                >
                                    Follow
                                </a>
                                <a
                                    href="#"
                                    class="focus:ring-ring-pink-700 flex h-10 w-10 items-center justify-center rounded-full bg-white text-lg font-semibold text-white hover:bg-neutral-100 focus:outline-none focus:ring-2 focus:ring-offset-2 sm:hidden"
                                >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 256 256"
                                        id="dots-three"
                                    >
                                        <rect
                                            width="256"
                                            height="256"
                                            fill="none"
                                        ></rect>
                                        <circle
                                            cx="128"
                                            cy="128"
                                            r="16"
                                            fill="#831843"
                                        ></circle>
                                        <circle
                                            cx="64"
                                            cy="128"
                                            r="16"
                                            fill="#831843"
                                        ></circle>
                                        <circle
                                            cx="192"
                                            cy="128"
                                            r="16"
                                            fill="#831843"
                                        ></circle>
                                    </svg>
                                </a>
                                <a
                                    href="#"
                                    class="focus:ring-ring-pink-700 hidden rounded-lg bg-white px-6 py-3 font-semibold text-red-950 shadow-md hover:bg-neutral-100 focus:outline-none focus:ring-2 focus:ring-offset-2 sm:flex"
                                >
                                    Message
                                </a>
                            </div>
                        </div>

                        <div
                            class="mt-8 flex flex-col items-center space-y-8 lg:mt-0 lg:items-center"
                        >
                            <div
                                class="followers-container text-l flex flex-col items-center gap-2 font-semibold text-red-950 lg:items-center"
                            >
                                <h3>Followers</h3>
                                <div class="flex flex-wrap gap-4">
                                    <img
                                        class="h-14 w-14 rounded-lg object-cover"
                                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg/440px-Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg"
                                        alt="profile img woman with glasses"
                                    />
                                    <img
                                        class="h-14 w-14 rounded-lg object-cover"
                                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg/440px-Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg"
                                        alt="profile img woman with glasses"
                                    />
                                </div>
                            </div>

                            <div
                                class="following-container text-l flex flex-col items-center gap-2 font-semibold text-red-950 lg:items-center"
                            >
                                <h3>Following</h3>
                                <div class="flex flex-wrap gap-4">
                                    <img
                                        class="h-14 w-14 rounded-lg object-cover"
                                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg/440px-Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg"
                                        alt="profile img woman with glasses"
                                    />
                                    <img
                                        class="h-14 w-14 rounded-lg object-cover"
                                        src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/86/Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg/440px-Woman_at_Lover%27s_Bridge_Tanjung_Sepat_%28cropped%29.jpg"
                                        alt="profile img woman with glasses"
                                    />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="py-11">
                <div class="m-auto h-0.5 w-2/3 rounded-lg bg-red-900"></div>
            </div>

            <section id="posts">
                

                <template id="logged-in-user-post-template">
                    <!-- Add h-full to make card take full height of its container -->
                    <div class=" ml-8 mr-8 rounded-md bg-white shadow-sm logged-in-user-post-container relative flex flex-col h-full">              
                        <div class="flex-1 p-4 sm:p-6 md:p-8">
                            <!-- Top row with options -->
                            <div class="flex justify-end items-start mb-4">
                                <!-- Options menu (horizontal dots) -->
                                <button 
                                    type="button" 
                                    class="options-btn p-1 text-gray-400 hover:text-red-600 transition-colors"
                                    aria-label="Post options"
                                >
                                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
                                </svg>
                                </button>
                                <!-- Dropdown menu (hidden by default) -->
                                <div class="options-menu hidden absolute right-2 top-12 w-32 bg-white rounded-md shadow-lg border border-gray-100 z-10">
                                    <button class="edit-post-btn w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-pink-50 hover:text-red-900">
                                        Edit
                                    </button>
                                    <button class="delete-post-btn w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-pink-50 hover:text-red-900">
                                        Delete
                                    </button>
                                </div>
                            </div>
                
                            <!-- Post title and body -->
                            <div class="pb-2 font-semibold text-red-900 text-base sm:text-lg md:text-xl logged-in-user-post-title"></div>
                            <div class="text-red-900 text-sm sm:text-base logged-in-user-post-body"></div>
                        </div>
                
                        <!-- Comment button section (now will stick to bottom) -->
                        <div class="mt-auto"> <!-- mt-auto pushes it to the bottom -->
                            <button 
                                type="button" 
                                class="w-full flex items-center justify-center gap-1 text-gray-500 hover:text-red-600 transition-colors bg-pink-50 border-t border-pink-100 p-3 rounded-b-md text-sm"
                            >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                </svg>
                                <span>Comment</span>
                            </button>
                        </div>
                    </div>
                </template>
                
                <div class="posts-section">
                    <h2 class="flex justify-center text-xl font-bold text-red-900">
                        My posts
                    </h2>
                    <div class="mt-4 grid gap-4 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                        
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="../js/main.js"></script>
    </body>
</html>
