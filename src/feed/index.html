<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Feed | CSS Frameworks CA Tailwind</title>
        <link rel="stylesheet" href="../style.css" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="../public/favicon_io/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="../public/favicon_io/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="../public/favicon_io/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>

    <body class="bg-pink-300">
        <!-- HEADER -->
        <header class="m md:text-lg md:font-bold">
            <nav class="container mx-auto">
                <div class="flex justify-start p-5">
                    <div
                        class="mx-auto hidden justify-center space-x-32 text-red-950 md:flex"
                    >
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/profile/index.html"
                        >
                            Profile
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/feed/index.html"
                        >
                            Feed
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/index.html"
                        >
                            Sign in
                        </a>
                    </div>

                    <div class="flex items-center md:hidden">
                        <button class="" id="menu-button">
                            <svg
                                class="h-6 w-6 text-red-950 hover:text-red-800"
                                fill="none"
                                stroke-linecap="square"
                                stroke-linejoin="round"
                                stroke-width="2.5"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="hidden font-bold text-red-950" id="mobile-nav">
                    <ul class="p-5 pt-0">
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/profile/index.html">Profile</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/feed/index.html">Feed</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/index.html">Sign in</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <div id="landing-page"></div>

            <section id="create-post-section">
                <div class="container mx-auto">
                    <h1
                        class="m-8 text-xl font-bold text-red-900 sm:text-left lg:text-center"
                    >
                        Create a Post
                    </h1>
                    <div
                        class="m-8 max-w-3xl rounded-md bg-white p-10 shadow-sm lg:mx-auto"
                    
                        >
                        <form id="create-post-form" class="space-y-6">
                            <div>
                                <label
                                    for="title"
                                    class="block text-sm font-medium text-gray-900"
                                    >Title</label
                                >
                                <input
                                    type="text"
                                    id="post-title"
                                    name="title"
                                    required
                                    class="w-full rounded-md border-gray-300 p-3 shadow-sm focus:outline-none focus:ring-1 focus:ring-pink-300 sm:text-sm"
                                    placeholder="Enter your post title"
                                />
                            </div>
                            <div>
                                <label
                                    for="post-text"
                                    class="block text-sm font-medium text-gray-900"
                                    >Text</label
                                >
                                <textarea
                                    id="text"
                                    name="text"
                                    rows="5"
                                    required
                                    class="w-full rounded-md border-gray-300 p-3 shadow-sm focus:outline-none focus:ring-1 focus:ring-pink-300 sm:text-sm"
                                    placeholder="Write something interesting..."
                                ></textarea>
                            </div>
                            <div>
                                <button
                                    type="submit"
                                    class="w-full rounded-md bg-red-900 px-4 py-3 text-white shadow-sm hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-700 focus:ring-offset-2 sm:text-sm"
                                >
                                    Post
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <div class="py-11">
                <div class="m-auto h-0.5 w-2/3 rounded-lg bg-red-900"></div>
            </div>

          


<!-- Feed Section -->
<section id="feed" class="pb-16">
    <div class="container mx-auto px-4">
        <h2
            class="mb-8 text-center text-2xl font-bold text-red-900"
        >
            Explore Posts
        </h2>

        <!-- Search and Filters -->
        <div
            class="mb-8 rounded-xl bg-white p-6 shadow-lg ring-1 ring-black/5 backdrop-blur-lg"
        >
            <div
                class="flex flex-col space-y-4 lg:flex-row lg:items-center lg:justify-between lg:space-y-0"
            >
                <!-- Search -->
                <div class="relative flex-1 lg:mr-4">
                    <svg
                        class="absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                        />
                    </svg>
                    <input
                        type="search"
                        id="search"
                        placeholder="Search posts"
                        class="w-full rounded-lg border-gray-200 bg-gray-50 py-2 pl-10 pr-4 text-sm focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                    />
                </div>

                <!-- Filter Options -->
                <div class="flex flex-wrap items-center gap-4">
                    <select
                        id="sort"
                        class="rounded-lg border-gray-200 bg-pink-50 px-4 py-2 text-sm text-red-900 hover:bg-pink-100 focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                    >
                        <option value="recent">Most Recent</option>
                        <option value="popular">
                            Most Popular
                        </option>
                        <option value="trending">Trending</option>
                    </select>

                    <select
                        id="category"
                        class="rounded-lg border-gray-200 bg-pink-50 px-4 py-2 text-sm text-red-900 hover:bg-pink-100 focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                    >
                        <option value="">All Categories</option>
                        <option value="discussion">
                            Discussion
                        </option>
                        <option value="question">Question</option>
                        <option value="announcement">
                            Announcement
                        </option>
                    </select>
                </div>
            </div>
        </div>


                        <div class="container mx-auto px-4">
                            <div id="card-container" class="grid gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 py-8">
                                <!-- Posts will be rendered here directly -->
                            </div>
                        </div>
                        
                            <!-- Template for posts (hidden) -->
                            <template id="post-template">
                                <div class="m-8 rounded-md bg-white p-10 shadow-sm post-container">
                                    <div class="font-semibold text-red-900 sm:text-lg lg:text-xl post-title">
                                        <!-- Title will be inserted here -->
                                    </div>
                                    <div class="text-red-900 sm:text-sm lg:mt-3 lg:text-base post-body">
                                        <!-- Body will be inserted here -->
                                    </div>
                                </div>
                            </template>
                        </div>
                      
                    
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="../main.js"></script>
    </body>
</html>
