<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Feed | CSS Frameworks CA Tailwind</title>
        <link rel="stylesheet" href="../style.css" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="../public/favicon_io/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="../public/favicon_io/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="../public/favicon_io/favicon-16x16.png"
        />
        <link rel="manifest" href="/site.webmanifest" />
    </head>

    <body class="bg-pink-300">
        <!-- HEADER -->
        <header class="m md:text-lg md:font-bold">
            <nav class="container mx-auto">
                <div class="flex justify-start p-5">
                    <div
                        class="mx-auto hidden justify-center space-x-32 text-red-950 md:flex"
                    >
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/profile/index.html"
                        >
                            Profile
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/feed/index.html"
                        >
                            Feed
                        </a>
                        <a
                            class="hover:underline hover:underline-offset-8 focus:text-red-900 focus:underline focus:underline-offset-8 active:underline active:underline-offset-8"
                            href="/index.html"
                        >
                            Sign in
                        </a>
                    </div>

                    <div class="flex items-center md:hidden">
                        <button class="" id="menu-button">
                            <svg
                                class="h-6 w-6 text-red-950 hover:text-red-800"
                                fill="none"
                                stroke-linecap="square"
                                stroke-linejoin="round"
                                stroke-width="2.5"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                            >
                                <path d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="hidden font-bold text-red-950" id="mobile-nav">
                    <ul class="p-5 pt-0">
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/profile/index.html">Profile</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/feed/index.html">Feed</a>
                        </li>
                        <li class="mb-5 hover:text-red-800 focus:text-red-900">
                            <a href="/index.html">Sign in</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <div id="landing-page"></div>

            <!-- Create Post Section -->
            <section id="create-post-section">
                <div class="container mx-auto px-4">
                    <div
                        class="mx-auto mt-8 max-w-3xl rounded-xl bg-white p-6 shadow-lg ring-1 ring-black/5"
                    >
                        <h2 class="mb-6 text-xl font-bold text-red-900">
                            Create a Post
                        </h2>
                        <form id="create-post-form" class="space-y-6">
                            <div>
                                <label
                                    for="post-title"
                                    class="block text-sm font-medium text-gray-900"
                                    >Title</label
                                >
                                <input
                                    type="text"
                                    id="post-title"
                                    name="title"
                                    required
                                    class="mt-1 w-full rounded-lg border-gray-200 p-3 shadow-sm focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20 sm:text-sm"
                                    placeholder="Enter your post title"
                                />
                            </div>
                            <div>
                                <label
                                    for="post-text"
                                    class="block text-sm font-medium text-gray-900"
                                    >Content</label
                                >
                                <textarea
                                    id="text"
                                    name="text"
                                    rows="5"
                                    required
                                    class="mt-1 w-full rounded-lg border-gray-200 p-3 shadow-sm focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20 sm:text-sm"
                                    placeholder="Write something interesting..."
                                ></textarea>
                            </div>
                            <button
                                type="submit"
                                class="w-full rounded-lg bg-red-900 px-4 py-3 text-white shadow-sm transition-colors hover:bg-red-800 focus:outline-none focus:ring-2 focus:ring-red-900 focus:ring-offset-2 sm:text-sm"
                            >
                                Post
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <div class="py-8">
                <div class="m-auto h-0.5 w-2/3 rounded-lg bg-red-900"></div>
            </div>

            <!-- Feed Section -->
            <section id="feed" class="pb-16">
                <div class="container mx-auto px-4">
                    <h2
                        class="mb-8 text-center text-2xl font-bold text-red-900"
                    >
                        Explore Posts
                    </h2>

                    <!-- Search and Filters -->
                    <div
                        class="mb-8 rounded-xl bg-white p-6 shadow-lg ring-1 ring-black/5 backdrop-blur-lg"
                    >
                        <div
                            class="flex flex-col space-y-4 lg:flex-row lg:items-center lg:justify-between lg:space-y-0"
                        >
                            <!-- Search -->
                            <div class="relative flex-1 lg:mr-4">
                                <svg
                                    class="absolute left-3 top-1/2 h-5 w-5 -translate-y-1/2 text-gray-400"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                    />
                                </svg>
                                <input
                                    type="search"
                                    id="search"
                                    placeholder="Search posts"
                                    class="w-full rounded-lg border-gray-200 bg-gray-50 py-2 pl-10 pr-4 text-sm focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                                />
                            </div>

                            <!-- Filter Options -->
                            <div class="flex flex-wrap items-center gap-4">
                                <select
                                    id="sort"
                                    class="rounded-lg border-gray-200 bg-pink-50 px-4 py-2 text-sm text-red-900 hover:bg-pink-100 focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                                >
                                    <option value="recent">Most Recent</option>
                                    <option value="popular">
                                        Most Popular
                                    </option>
                                    <option value="trending">Trending</option>
                                </select>

                                <select
                                    id="category"
                                    class="rounded-lg border-gray-200 bg-pink-50 px-4 py-2 text-sm text-red-900 hover:bg-pink-100 focus:border-red-900 focus:outline-none focus:ring-2 focus:ring-red-900/20"
                                >
                                    <option value="">All Categories</option>
                                    <option value="discussion">
                                        Discussion
                                    </option>
                                    <option value="question">Question</option>
                                    <option value="announcement">
                                        Announcement
                                    </option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Posts Grid -->
                    <div
                        id="card-container"
                        class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
                    >
                        <!-- Posts will be rendered here -->
                        <template id="post-template">
                            <article
                                class="group relative overflow-hidden rounded-xl bg-white p-6 shadow-lg ring-1 ring-black/5 transition-all hover:shadow-xl"
                            >
                                <div
                                    class="absolute inset-0 bg-gradient-to-b from-pink-50 to-transparent opacity-0 transition-opacity duration-300 group-hover:opacity-100"
                                ></div>
                                <div class="relative">
                                    <div class="mb-3 flex items-center gap-3">
                                        <div
                                            class="h-8 w-8 rounded-full bg-gradient-to-br from-red-900 to-red-700"
                                        ></div>
                                        <div>
                                            <h3
                                                class="font-medium text-red-900"
                                            >
                                                User Name
                                            </h3>
                                            <p class="text-xs text-gray-500">
                                                2 hours ago
                                            </p>
                                        </div>
                                    </div>
                                    <h2
                                        class="post-title mb-2 text-lg font-semibold text-red-900"
                                    >
                                        <!-- Title will be inserted here -->
                                    </h2>
                                    <p
                                        class="post-body mb-4 text-sm text-gray-600"
                                    >
                                        <!-- Content will be inserted here -->
                                    </p>
                                    <div
                                        class="flex items-center justify-between border-t border-gray-100 pt-4"
                                    >
                                        <button
                                            class="flex items-center text-gray-500 hover:text-red-900"
                                        >
                                            <svg
                                                class="mr-1 h-4 w-4"
                                                fill="none"
                                                stroke="currentColor"
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                    stroke-width="2"
                                                />
                                            </svg>
                                            <span class="text-xs">24</span>
                                        </button>
                                        <button
                                            class="flex items-center text-gray-500 hover:text-red-900"
                                        >
                                            <svg
                                                class="mr-1 h-4 w-4"
                                                fill="none"
                                                stroke="currentColor"
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                    stroke-width="2"
                                                />
                                            </svg>
                                            <span class="text-xs">12</span>
                                        </button>
                                        <button
                                            class="flex items-center text-gray-500 hover:text-red-900"
                                        >
                                            <svg
                                                class="mr-1 h-4 w-4"
                                                fill="none"
                                                stroke="currentColor"
                                                viewBox="0 0 24 24"
                                            >
                                                <path
                                                    d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"
                                                    stroke-linecap="round"
                                                    stroke-linejoin="round"
                                                    stroke-width="2"
                                                />
                                            </svg>
                                            <span class="text-xs">Share</span>
                                        </button>
                                    </div>
                                </div>
                            </article>
                        </template>
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="../main.js"></script>
    </body>
</html>
